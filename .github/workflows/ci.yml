name: CI

on:
  push:
    branches: [ main, master, 'fix/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Removendo matrix por enquanto e usando versão fixa para evitar
    # problemas de parsing/compatibilidade com a propriedade 'python-version'.
    # Usamos explicitamente a string '3.10'.

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q
        env:
          CI: true
